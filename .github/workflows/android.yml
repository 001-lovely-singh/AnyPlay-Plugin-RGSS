
name: Build AnyPlay RGSS Plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      build_r34:
        description: 'Also build the optional r34 runtime (Ruby 3.4). Slower build. Leave off for a normal release.'
        type: boolean
        default: false
      r34_yjit:
        description: 'r34 only: build Ruby 3.4 with YJIT on arm64 (needs Rust). Ignored when build_r34 is off.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: 23.2.8568313
      RUBY_VERSION: "3.1"
      BUILD_R34: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_r34 == 'true') && '1' || '0' }}
      BUILD_R34_YJIT: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_r34 == 'true' && github.event.inputs.r34_yjit == 'true') && '1' || '0' }}

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. System dependencies (Fixed Ubuntu mirror + retries)
      - name: Install system dependencies
        run: |
          set -e

          echo "Checking and fixing Ubuntu package mirrors..."

          # Replace Azure mirror with the official Ubuntu archive mirror.
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' {} +

          echo "Updated Ubuntu package mirrors."

          # Update package lists with automatic retries.
          for attempt in 1 2 3; do
            echo "APT update attempt $attempt/3..."

            if sudo apt-get update \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: apt-get update failed after 3 attempts."
              exit 1
            fi

            echo "Waiting 15 seconds before retry..."
            sleep 15
          done

          # Install required packages with retries.
          for attempt in 1 2 3; do
            echo "Package installation attempt $attempt/3..."

            if sudo apt-get install -y \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              build-essential cmake curl gpg xxd \
              ruby-full autoconf automake libtool pkg-config \
              python3 git unzip bison gperf; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Dependency installation failed after 3 attempts."
              exit 1
            fi

            echo "Refreshing package lists before retry..."
            sudo apt-get update -o Acquire::Retries=5
            sleep 15
          done

          echo "System dependencies installed successfully."

      # 4. Ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      # 5. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      # 5b. Rust (only for r34 with YJIT)
      - name: Set up Rust for YJIT (r34)
        if: env.BUILD_R34_YJIT == '1'
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-linux-android
          rustc --version

      # 6. Export toolchain paths
      - name: Export NDK toolchain paths
        run: |
          ARCH=linux-x86_64
          NDK_PATH="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/$ARCH/bin"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ARCH=$ARCH" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

      # 7. Download JNI dependencies & Generate XXD
      - name: Download JNI dependencies (get_deps.sh)
        working-directory: app/jni
        run: |
          chmod +x get_deps.sh
          ./get_deps.sh
          cd mkxp-z
          chmod +x make_xxd.sh
          ./make_xxd.sh

      # 8. Compile native dependencies (arm64-v8a)
      - name: Compile native deps — arm64-v8a (64-bit)
        working-directory: app/jni
        run: |
          HOST=aarch64-linux-android \
          TARGET=aarch64-linux-android \
          ABI=arm64-v8a \
          LDFLAGS="-Wl,-z,max-page-size=16384" \
          make -j$(nproc)

          if [ -d "build-arm64-v8a" ] && [ ! -d "build-arm64" ]; then
            ln -s build-arm64-v8a build-arm64
          fi

          test -f build-arm64-v8a/lib/libruby.so
          test -f build-r18-arm64-v8a/lib/libruby.so

          if [ "$BUILD_R34" = "1" ]; then
            test -f build-r34-arm64-v8a/lib/libruby.so
          fi

      # 8b. Compile native deps (armeabi-v7a, 32-bit)
      - name: Compile native deps — armeabi-v7a (32-bit)
        working-directory: app/jni
        run: |
          make clean

          HOST=armv7a-linux-androideabi \
          TARGET=arm-linux-androideabi \
          ABI=armeabi-v7a \
          make -j$(nproc)

          ls -la build-armeabi-v7a/lib | head -30

          test -f build-armeabi-v7a/lib/libopenal.so
          test -d build-arm64-v8a/lib
          test -f build-armeabi-v7a/lib/libruby.so
          test -f build-r18-armeabi-v7a/lib/libruby.so
          test -f build-r18-arm64-v8a/lib/libruby.so

          if [ "$BUILD_R34" = "1" ]; then
            test -f build-r34-armeabi-v7a/lib/libruby.so
            test -f build-r34-arm64-v8a/lib/libruby.so
          fi

      # 9. Make Gradle wrapper executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 10. Cache Gradle packages
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 11. Signing key
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANYPLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/anyplay-release.keystore"
            echo "ANYPLAY_KEYSTORE_FILE=$RUNNER_TEMP/anyplay-release.keystore" >> "$GITHUB_ENV"
            echo "ANYPLAY_STORE_PASSWORD=${{ secrets.ANYPLAY_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANYPLAY_KEY_ALIAS=${{ secrets.ANYPLAY_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANYPLAY_KEY_PASSWORD=${{ secrets.ANYPLAY_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found: the APK will be signed with a temporary debug key."
          fi

      # 12. Build release APK
      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.suppressUnsupportedCompileSdk=34 \
            --no-daemon \
            --stacktrace

      # 12b. Name the APK
      - name: Name the APK
        run: |
          find app/build/outputs/apk/release -name "*.apk"

          APK=$(find app/build/outputs/apk/release -name "*universal*.apk" | head -1)

          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi

          cp "$APK" AnyPlay-RGSS-Plugin.apk
          echo "APK_PATH=AnyPlay-RGSS-Plugin.apk" >> "$GITHUB_ENV"

      # 12c. Verify native runtimes
      - name: Verify runtime libraries in the APK
        continue-on-error: true
        run: |
          chmod +x app/jni/verify-runtimes.sh
          app/jni/verify-runtimes.sh "$APK_PATH"

      # 13. Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyPlay-RGSS-Plugin
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # 14. Determine release tag
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # 15. Create GitHub Release and upload APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "AnyPlay RGSS Plugin ${{ steps.tag.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
